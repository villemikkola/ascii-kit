name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npx tsc --noEmit
        working-directory: extension
      - run: npm test
        working-directory: extension
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run readme -- --check
